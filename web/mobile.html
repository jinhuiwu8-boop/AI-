<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#196d55">
    <title>店内打单 · 手机版</title>
    <link rel="stylesheet" href="/mobile.css">
    <script type="module" src="/mobile-app.mjs"></script>
  </head>
  <body data-presentation="mobile">
    <a class="skip-link" href="#main">跳到页面内容</a>
    <header class="mobile-header"><button id="mobile-back" class="back-button" type="button" aria-label="返回上级" hidden>‹</button><h1 id="mobile-title">工作台</h1><button type="button" id="refresh-button" class="refresh-button" aria-label="刷新数据">↻</button></header>
    <div class="mobile-notification"><span class="notification-symbol">铃</span><div>锁屏提醒待 APK 接入<small>当前可自行操作本地测试功能。</small></div></div>
    <div id="environment-note" class="environment-note">本地测试数据 · 已保存内容可查询</div>
    <div id="pending-banner" class="pending-banner" hidden></div>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <main id="main" tabindex="-1"><div class="loading-state">正在读取手机工作台…</div></main>
    <span id="date-label" class="visually-hidden"></span>
    <nav id="phone-nav" class="phone-nav" aria-label="手机主要导航"></nav>
  </body>
</html>
